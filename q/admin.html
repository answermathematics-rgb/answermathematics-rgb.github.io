<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1E2A44">
<title>질문 대기열 · 앤서수학</title>
<style>
  :root { --red:#B62A1D; --navy:#1E2A44; --bg:#F6F7F9; --line:#E3E6EB; --muted:#6B7280; --green:#1F8A5B; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--navy); font-family:-apple-system,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; }
  .top { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); }
  .head { display:flex; align-items:center; gap:10px; padding:14px 16px 8px; }
  .head .bar { width:5px; height:22px; background:var(--red); border-radius:2px; }
  .head h1 { margin:0; font-size:18px; font-weight:800; }
  .head .live { margin-left:auto; font-size:12px; color:var(--muted); }
  .tabs { display:flex; padding:0 12px; }
  .tab { flex:1; border:0; background:none; padding:10px 0 12px; font-size:15px; font-weight:700; color:var(--muted); border-bottom:3px solid transparent; }
  .tab.on { color:var(--navy); border-bottom-color:var(--red); }
  .pane { display:none; padding:12px 12px 90px; }
  .pane.on { display:block; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .card.first { border:2px solid var(--red); }
  .crow { display:flex; align-items:center; gap:10px; }
  .num { flex:none; width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .card.first .num { background:var(--red); }
  .nm { font-size:18px; font-weight:800; }
  .meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .done { flex:none; white-space:nowrap; margin-left:auto; border:0; background:var(--green); color:#fff; font-weight:700; font-size:15px; padding:10px 16px; border-radius:10px; }
  .undo { flex:none; white-space:nowrap; margin-left:auto; border:1px solid var(--line); background:#fff; color:var(--muted); font-size:13px; padding:7px 12px; border-radius:8px; }
  .thumbs { display:flex; gap:8px; overflow-x:auto; margin-top:10px; }
  .thumb { position:relative; flex:none; }
  .thumb img { height:150px; border-radius:8px; border:1px solid var(--line); display:block; background:#fafafa; }
  .qimg { position:relative; margin-top:10px; }
  .qimg img { width:100%; max-height:260px; object-fit:contain; border:1px solid var(--line); border-radius:10px; background:#fff; display:block; }
  .qimg .x { position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; }
  .thumb .x { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:13px; }
  .togg { border:0; background:none; padding:0; cursor:pointer; text-decoration:underline; }
  .sec { font-size:13px; color:var(--muted); font-weight:700; margin:18px 4px 8px; }
  .empty { text-align:center; color:var(--muted); padding:50px 10px; line-height:1.6; }
  .btn { border:0; border-radius:12px; font-size:17px; font-weight:800; padding:15px; width:100%; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.ghost { background:#fff; border:1px solid var(--line); color:var(--navy); font-size:15px; font-weight:700; }
  .btn:disabled { opacity:.45; }
  .opts { display:flex; gap:8px; margin:10px 0; }
  .opts select, .opts label { flex:1; font-size:14px; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; display:flex; align-items:center; gap:6px; }
  .plist .pr { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid var(--line); font-size:15px; }
  .hs { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:14px; margin-bottom:6px; }
  .hs th, .hs td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; }
  .hs th { background:#F1F3F6; font-size:12px; color:var(--muted); }
  .hs td.n { text-align:right; font-weight:800; }
  .hs tr.click { cursor:pointer; }
  .day { font-size:13px; font-weight:800; color:var(--navy); margin:16px 4px 8px; }
  .hrow { display:flex; gap:10px; align-items:flex-start; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; }
  .hrow .who { flex:none; width:64px; }
  .hrow .who b { display:block; font-size:15px; }
  .hrow .who span { font-size:11px; color:var(--muted); }
  .hrow .thumbs { margin-top:0; flex:1; }
  .hrow .thumb img { height:90px; }
  .plist .pr span { color:var(--muted); display:flex; align-items:center; }
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; z-index:20; }
  #viewer img { max-width:96%; max-height:92%; background:#fff; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:30; }
  #modal .box { background:#fff; width:100%; border-radius:18px 18px 0 0; padding:20px 16px 26px; }
  #modal .t { font-size:18px; font-weight:800; margin-bottom:6px; }
  #modal .d { color:var(--muted); font-size:14px; margin-bottom:16px; line-height:1.5; }
  #modal .row { display:flex; gap:8px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 16px; border-radius:10px; font-size:14px; display:none; z-index:40; }

  /* ───── 출력물 ───── */
  #printArea { display:none; }
  @page { size:A4; margin:10mm; }
  @media print {
    body { background:#fff; }
    .top, .pane, #viewer, #modal, #toast { display:none !important; }
    #printArea { display:block; }
    .page { height:277mm; display:flex; flex-direction:column; page-break-after:always; break-after:page; }
    .page:last-child { page-break-after:auto; break-after:auto; }
    .ph { display:flex; align-items:center; gap:3mm; border-bottom:1.5px solid var(--navy); padding-bottom:3mm; margin-bottom:6mm; }
    .ph .lg { height:11mm; width:auto; margin-right:2px; }
    .ph .bar { width:1.2mm; height:9mm; background:var(--red); }
    .ph .brand { font-size:7.5pt; letter-spacing:2px; font-weight:700; color:#8A93A3; margin-left:6px; padding-bottom:3px; }
    .ph .ttl { font-size:20pt; font-weight:900; margin-left:4px; color:var(--navy); letter-spacing:-.3px; }
    .ph .info { margin-left:auto; font-size:11pt; }
    .ph .info b { font-size:14pt; }
    .slot { flex:1; display:flex; flex-direction:column; min-height:0; }
    .slot + .slot { border-top:1px dashed #bbb; padding-top:5mm; }
    .slot .qn { font-weight:800; font-size:14pt; margin-bottom:3mm; color:#000; }
    .slot img { max-width:100%; max-height:95mm; object-fit:contain; align-self:flex-start; }
    .slot.solo img { max-height:150mm; }
    .slot .space { flex:1; }
    .pf { text-align:right; line-height:0; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="head"><div class="bar"></div><h1>질문 대기열</h1><span class="live" id="live">…</span></div>
  <div class="tabs"><button class="tab on" data-p="pQueue">대기열 <span id="cntQ"></span></button><button class="tab" data-p="pPrint">오답 출력 <span id="cntP"></span></button><button class="tab" data-p="pHist">질문 기록</button></div>
</div>

<div class="pane on" id="pQueue"></div>

<div class="pane" id="pPrint">
  <div class="opts">
    <select id="day"><option value="0">오늘</option><option value="1">어제</option><option value="2">그저께</option></select>
    <label><input type="checkbox" id="incl"> 이미 출력한 것도</label>
  </div>
  <div class="plist" id="plist"></div>
  <div style="height:14px"></div>
  <button class="btn red" id="printBtn" disabled>출력하기</button>
  <div style="height:8px"></div>
  <button class="btn ghost" id="testBtn">🔔 워치 알림 테스트</button>
  <div class="sec">공기계 비밀번호</div>
  <div class="muted" style="font-size:13px;color:var(--muted);margin:0 4px 8px">학생이 비밀번호를 까먹었거나 잠겼으면 초기화 → 다음 로그인 때 새로 만들어요.</div>
  <div class="plist" id="pinList"></div>
</div>

<div class="pane" id="pHist">
  <div class="opts">
    <select id="hStu"><option value="">전체 학생</option></select>
    <select id="hDays"><option value="7">최근 7일</option><option value="30" selected>최근 30일</option><option value="90">최근 3개월</option><option value="3650">전체</option></select>
  </div>
  <div id="hSum"></div>
  <div id="hList"></div>
</div>

<div id="viewer"><img id="vimg"></div>
<div id="modal"><div class="box"><div class="t" id="mt"></div><div class="d" id="md"></div><div class="row" id="mr"></div></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/auto-render.min.js"></script>
<script src="sheet.js"></script>
<script>
const FN = "https://hddsyoaymvpfcloqthyv.supabase.co/functions/v1/qna";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkZHN5b2F5bXZwZmNsb3F0aHl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODUwNzcsImV4cCI6MjA5Njc2MTA3N30._x8RtDqIACVr2AC7u5VXbntbmderTw4sV4t3zkp6dC0";
const params = new URLSearchParams(location.search);
let TOKEN = params.get("t") || "";
try { if (TOKEN) localStorage.setItem("qa", TOKEN); else TOKEN = localStorage.getItem("qa") || ""; } catch (_) {}
if (params.get("t")) history.replaceState(null, "", location.pathname);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (m) => { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 3000); };
async function call(action, body = {}) {
  const r = await fetch(FN, { method: "POST", headers: { "content-type": "application/json", apikey: ANON, authorization: "Bearer " + ANON },
    body: JSON.stringify({ action, token: TOKEN, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "오류 " + r.status);
  return j;
}
function ask(title, desc, buttons) {
  return new Promise(res => {
    $("mt").textContent = title; $("md").textContent = desc;
    $("mr").innerHTML = buttons.map((b, i) => `<button class="btn ${b.cls || "ghost"}" data-i="${i}">${b.label}</button>`).join("");
    $("modal").style.display = "flex";
    $("mr").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $("modal").style.display = "none"; res(buttons[+b.dataset.i].value); };
  });
}
const ago = (iso) => { const m = Math.floor((Date.now() - new Date(iso)) / 60000); return m < 1 ? "방금" : m + "분 전"; };
const hm = (iso) => new Date(iso).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === t.dataset.p));
  if (t.dataset.p === "pPrint") { loadPrint(); loadPins(); }
  if (t.dataset.p === "pHist") loadHist();
});

if (!TOKEN) document.body.innerHTML = '<div class="empty">원장 링크로 한 번 열어주세요.</div>';

// ───── 대기열 ─────
let items = [], showDone = false;
function group(list) {
  const m = new Map();
  list.forEach(q => { if (!m.has(q.student_id)) m.set(q.student_id, { sid: q.student_id, st: q.students || {}, qs: [] }); m.get(q.student_id).qs.push(q); });
  return [...m.values()];
}
async function loadQueue(silent) {
  try {
    const r = await call("admin_queue");
    items = r.items; renderQueue();
    $("live").textContent = "업데이트 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (e) { $("live").textContent = "연결 끊김"; if (!silent) toast(e.message); }
}
function renderQueue() {
  // 문제 올린 순서대로 한 문제씩 (학생별로 묶지 않음)
  const waiting = items.filter(q => q.status === "waiting");
  const done = items.filter(q => q.status === "done").sort((x, y) => new Date(y.done_at || 0) - new Date(x.done_at || 0));
  $("cntQ").textContent = waiting.length ? `(${waiting.length})` : "";
  const unprinted = items.filter(q => !q.printed_at).length;
  $("cntP").textContent = unprinted ? `(${unprinted})` : "";
  // 같은 학생의 몇 번째 질문인지 (오늘 기준)
  const nth = {}; const seen = {};
  items.forEach(q => { seen[q.student_id] = (seen[q.student_id] || 0) + 1; nth[q.id] = seen[q.student_id]; });
  let h = "";
  if (!waiting.length) h += '<div class="empty">대기 중인 질문 없음 ✨<br><span style="font-size:13px">학생이 공기계로 찍으면 여기 뜨고 워치로 알림이 가요.</span></div>';
  waiting.forEach((q, i) => {
    const st = q.students || {};
    h += `<div class="card ${i === 0 ? "first" : ""}"><div class="crow"><div class="num">${i + 1}</div>
      <div><div class="nm">${esc(st.name)}</div><div class="meta">${esc(st.school || "")} · 오늘 ${nth[q.id]}번째 질문 · ${hm(q.created_at)} (${ago(q.created_at)})</div></div>
      <button class="done" data-done="${q.id}">완료</button></div>
      <div class="qimg"><img src="${esc(q.url)}" data-full="${esc(q.orig_url || q.url)}" loading="lazy"><button class="x" data-del="${q.id}">✕</button></div></div>`;
  });
  if (done.length) {
    h += `<button class="sec togg" id="doneToggle">오늘 완료 ${done.length}문제 ${showDone ? "▾ 접기" : "▸ 보기"}</button>`;
    if (showDone) done.forEach(q => {
      const st = q.students || {};
      h += `<div class="card"><div class="crow"><div class="thumb"><img src="${esc(q.url)}" data-full="${esc(q.orig_url || q.url)}" loading="lazy" style="height:56px"></div>
        <div><div class="nm" style="font-size:16px">${esc(st.name)}</div><div class="meta">${hm(q.created_at)} 질문 · ${q.done_at ? hm(q.done_at) + " 완료" : ""}</div></div>
        <button class="undo" data-undo="${q.id}">되돌리기</button></div></div>`;
    });
  }
  $("pQueue").innerHTML = h;
}
$("pQueue").onclick = async (e) => {
  const t = e.target;
  if (t.dataset.done) { t.disabled = true; await call("admin_done", { id: t.dataset.done }).catch(x => toast(x.message)); loadQueue(); }
  else if (t.id === "doneToggle") { showDone = !showDone; renderQueue(); }
  else if (t.dataset.undo) { await call("admin_undo", { id: t.dataset.undo }).catch(x => toast(x.message)); loadQueue(); }
  else if (t.dataset.del) {
    const ok = await ask("이 사진 지울까요?", "잘못 찍은 사진이면 지워요. 출력에서도 빠져요.", [{ label: "취소", value: false }, { label: "지우기", value: true, cls: "red" }]);
    if (ok) { await call("admin_delete", { id: t.dataset.del }).catch(x => toast(x.message)); loadQueue(); }
  }
  else if (t.dataset.full) { $("vimg").src = t.dataset.full; $("viewer").style.display = "flex"; }
};
$("viewer").onclick = () => $("viewer").style.display = "none";

// ───── 출력 ─────
let printItems = [];
let allPrint = [];
// 출력: 학원 PC '앤서수학 프린트' 화면으로 보냄 → PC가 바로 인쇄(창 없이). PC가 꺼져 있으면 이 기기에서 인쇄
async function printSet(list, label, markAfter = true) {
  if (!list.length) return;
  const names = [...new Set(list.map(q => q.students?.name))].join(", ");
  try {
    const st0 = await call("admin_print_job_status", { job_id: "" });
    const alive = st0.printer_seen && (Date.now() - new Date(st0.printer_seen).getTime() < 20000);
    if (!alive) { await localPrint(list, label, markAfter, "학원 PC의 '앤서수학 프린트' 창이 꺼져 있어요."); return; }
    const { job_id } = await call("admin_print_job", { ids: list.map(q => q.id), label: label || "" });
    toast(`🖨 ${names} — 학원 PC로 보냈어요`);
    for (let i = 0; i < 40; i++) {
      await new Promise(r => setTimeout(r, 1500));
      const st = await call("admin_print_job_status", { job_id });
      if (st.job?.status === "done") { toast(`✅ ${names} 인쇄 완료`); loadQueue(true); break; }
      if (st.job?.status === "error") { toast("인쇄 실패: " + (st.job.error || "")); break; }
    }
  } catch (e) { toast(e.message); }
  loadPrint();
}
// 이 기기에서 직접 인쇄 (PC 관리자 화면에서는 잘 됨)
async function localPrint(list, label, markAfter, why) {
  toast("오답 정리지 만드는 중…");
  await AnswerSheet.build($("printArea"), list, { label });
  await new Promise(res => {
    $("mt").textContent = "이 기기에서 인쇄할까요?";
    $("md").textContent = `${why || ""} 이 기기에서 바로 인쇄하려면 '인쇄하기'를 누르세요.`;
    $("mr").innerHTML = '<button class="btn ghost" id="pCancel">취소</button><button class="btn red" id="pGo">🖨 인쇄하기</button>';
    $("mr").onclick = null; $("modal").style.display = "flex";
    $("pGo").onclick = () => { $("modal").style.display = "none"; window.print(); res(true); };
    $("pCancel").onclick = () => { $("modal").style.display = "none"; res(false); };
  });
  if (markAfter) {
    const ok = await ask("출력 잘 됐어요?", "'출력 완료'를 누르면 다음엔 새로 올라온 것만 출력돼요.", [{ label: "아직", value: false }, { label: "출력 완료", value: true, cls: "red" }]);
    if (ok) { await call("admin_mark_printed", { ids: list.map(q => q.id) }).catch(x => toast(x.message)); toast("출력 완료로 표시했어요"); loadQueue(true); }
  }
  loadPrint();
}
async function loadPrint() {
  $("plist").innerHTML = '<div class="empty">불러오는 중…</div>'; $("printBtn").disabled = true;
  try {
    const r = await call("admin_print_list", { days_ago: +$("day").value, include_printed: $("incl").checked });
    printItems = r.items; allPrint = r.items;
    const gs = group(printItems);
    $("plist").innerHTML = gs.length ? gs.map(g => `<div class="pr"><b>${esc(g.st.name)}</b><span>${g.qs.length}문제 · ${Math.ceil(g.qs.length / 2)}장
      <button class="done" style="margin-left:10px;padding:8px 14px;font-size:14px;background:var(--navy)" data-sp="${g.sid}">이 학생만 출력</button></span></div>`).join("")
      : '<div class="empty">출력할 질문 문제가 없어요.</div>';
    $("printBtn").disabled = !gs.length;
    $("printBtn").textContent = gs.length ? `전체 출력 · ${gs.length}명 ${printItems.length}문제` : "출력하기";
  } catch (e) { $("plist").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
$("day").onchange = loadPrint; $("incl").onchange = loadPrint;

function buildPrint(label) {
  const dayN = +$("day").value;
  const d = new Date(Date.now() - dayN * 864e5);
  const ds = label || `${d.getMonth() + 1}월 ${d.getDate()}일`;
  let h = "";
  group(printItems).forEach(g => {
    const pages = [];
    for (let i = 0; i < g.qs.length; i += 2) pages.push(g.qs.slice(i, i + 2));
    pages.forEach((pg, pi) => {
      h += `<div class="page"><div class="ph"><img class="lg" src="logo.png"><div class="bar"></div><div class="ttl">오답 정리</div>
        <div class="info"><b>${esc(g.st.name)}</b> · ${ds}${pages.length > 1 ? ` · ${pi + 1}/${pages.length}` : ""}</div></div>`;
      pg.forEach((q, k) => {
        h += `<div class="slot ${pg.length === 1 ? "solo" : ""}"><div class="qn">${pi * 2 + k + 1}</div><img src="${esc(q.url)}"><div class="space"></div></div>`;
      });
      h += `<div class="pf"><img src="logo-ko.png" style="height:7mm"></div></div>`;
    });
  });
  $("printArea").innerHTML = h;
  return Promise.all([...$("printArea").querySelectorAll("img")].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
}
$("printBtn").onclick = async () => {
  $("printBtn").disabled = true; $("printBtn").textContent = "준비 중…";
  await printSet(allPrint);
};
$("plist").onclick = async (e) => {
  const b = e.target.closest("[data-sp]"); if (!b) return;
  b.disabled = true; b.textContent = "준비 중…";
  await printSet(allPrint.filter(q => q.student_id === b.dataset.sp));
};
async function loadPins() {
  try {
    const { students } = await call("admin_students");
    $("pinList").innerHTML = students.map(s => `<div class="pr"><b>${esc(s.name)}</b>
      <span>${s.locked ? "🔒 잠김 · " : ""}${s.has_pin ? (s.reg ? esc(s.reg) + " 등록" : "등록됨") : "미등록"}
      ${s.has_pin ? `<button class="undo" style="margin-left:8px" data-reset="${s.id}" data-name="${esc(s.name)}">초기화</button>` : ""}</span></div>`).join("");
  } catch (e) { $("pinList").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
$("pinList").onclick = async (e) => {
  const b = e.target.closest("[data-reset]"); if (!b) return;
  const ok = await ask(`${b.dataset.name} 비밀번호 초기화?`, "지금 로그인된 공기계도 로그아웃돼요. 다음 로그인 때 새 비밀번호를 만들어요.", [{ label: "취소", value: false }, { label: "초기화", value: true, cls: "red" }]);
  if (ok) { await call("admin_reset_pin", { student_id: b.dataset.reset }).catch(x => toast(x.message)); toast("초기화했어요"); loadPins(); }
};
// ───── 질문 기록 ─────
let histItems = [], stuLoaded = false;
async function loadHist() {
  if (!stuLoaded) {
    try { const { students } = await call("admin_students");
      $("hStu").innerHTML = '<option value="">전체 학생</option>' + students.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
      stuLoaded = true; } catch (_) {}
  }
  $("hList").innerHTML = '<div class="empty">불러오는 중…</div>'; $("hSum").innerHTML = "";
  try {
    const sid = $("hStu").value;
    const r = await call("admin_history", { days: +$("hDays").value, student_id: sid || undefined });
    histItems = r.items; renderHist(sid);
  } catch (e) { $("hList").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
const ymd = (iso) => new Date(new Date(iso).getTime() + 9 * 3600e3).toISOString().slice(0, 10);
const dayLabel = (d) => { const x = new Date(d + "T00:00:00+09:00"); return `${x.getMonth() + 1}월 ${x.getDate()}일 (${"일월화수목금토"[x.getDay()]})`; };
function renderHist(sid) {
  if (!histItems.length) { $("hList").innerHTML = '<div class="empty">이 기간에 질문한 문제가 없어요.</div>'; return; }
  if (!sid) {
    // 학생별 요약
    const m = new Map();
    histItems.forEach(q => { const k = q.student_id; if (!m.has(k)) m.set(k, { name: q.students?.name || "", n: 0, days: new Set(), last: q.created_at }); const v = m.get(k); v.n++; v.days.add(ymd(q.created_at)); });
    const rows = [...m.entries()].sort((a, b) => b[1].n - a[1].n);
    $("hSum").innerHTML = `<table class="hs"><tr><th>학생</th><th style="text-align:right">질문 수</th><th style="text-align:right">질문한 날</th><th>최근</th></tr>`
      + rows.map(([id, v]) => `<tr class="click" data-sid="${id}"><td><b>${esc(v.name)}</b></td><td class="n">${v.n}</td><td class="n">${v.days.size}일</td><td>${dayLabel(ymd(v.last)).replace(/ \(.\)/, "")}</td></tr>`).join("")
      + `</table><div class="meta" style="margin:0 4px 6px">이름 누르면 그 학생 기록만 보여요</div>`;
  } else {
    const name = histItems[0].students?.name || "";
    $("hSum").innerHTML = `<div class="card" style="display:flex;align-items:center;gap:10px"><div><div class="nm">${esc(name)}</div><div class="meta">${histItems.length}문제 · ${new Set(histItems.map(q => ymd(q.created_at))).size}일</div></div>
      <button class="done" style="background:var(--red)" id="hPrint">이 기간 다시 출력</button></div>`;
  }
  let h = "", cur = "";
  const byDay = new Map();
  histItems.forEach(q => { const d = ymd(q.created_at); if (!byDay.has(d)) byDay.set(d, new Map()); const g = byDay.get(d); if (!g.has(q.student_id)) g.set(q.student_id, []); g.get(q.student_id).push(q); });
  byDay.forEach((g, d) => {
    h += `<div class="day">${dayLabel(d)}</div>`;
    g.forEach(qs => {
      const st = qs[0].students || {};
      h += `<div class="hrow"><div class="who"><b>${esc(st.name)}</b><span>${qs.length}문제 · ${hm(qs[qs.length - 1].created_at)}</span></div>
        <div class="thumbs">${qs.slice().reverse().map(q => `<div class="thumb"><img src="${esc(q.url)}" data-full="${esc(q.orig_url || q.url)}" loading="lazy"></div>`).join("")}</div></div>`;
    });
  });
  $("hList").innerHTML = h;
}
$("hStu").onchange = loadHist; $("hDays").onchange = loadHist;
$("hSum").onclick = async (e) => {
  const tr = e.target.closest("[data-sid]"); if (tr) { $("hStu").value = tr.dataset.sid; loadHist(); return; }
  if (e.target.id === "hPrint") {
    await printSet(histItems.slice().reverse(), `최근 ${$("hDays").selectedOptions[0].text.replace("최근 ", "")}`, false);
  }
};
$("hList").onclick = (e) => { const f = e.target.dataset.full; if (f) { $("vimg").src = f; $("viewer").style.display = "flex"; } };

$("testBtn").onclick = async () => { await call("admin_test_notify").then(() => toast("알림 보냈어요. 워치 확인해보세요")).catch(x => toast(x.message)); };

if (TOKEN) { loadQueue(); setInterval(() => { if (!document.hidden) loadQueue(true); }, 5000); document.addEventListener("visibilitychange", () => { if (!document.hidden) loadQueue(true); }); }
</script>
