<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>앤서수학 포털</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 폰 한 손 화면 기준: 위에서 아래로 공지 → 회차 → 탭(일지·영상·분석) */
:root{
  --brand:#B62A1D; --brand-soft:#F8E9E7; --navy:#1E2A44; --navy-soft:#E8EBF2;
  --bg:#F6F5F3; --card:#FFFFFF; --ink:#1C1F26; --muted:#7A7F8C; --line:#E7E4E0;
  --ok:#1E8A55; --ok-soft:#E3F3EA; --warn:#B7791F; --warn-soft:#FBF1DC; --bad:#B62A1D;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --brand:#E0624F; --brand-soft:#3A1F1C; --navy:#C9D3EA; --navy-soft:#232B3D;
  --bg:#121418; --card:#1B1E24; --ink:#ECEDF0; --muted:#9097A4; --line:#2B2F37;
  --ok:#4CC28A; --ok-soft:#173326; --warn:#E3B04B; --warn-soft:#352A12; --bad:#E0624F; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:max(14px,env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}
.mark{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.4px;font-size:16px;color:var(--navy)}
.mark i{width:22px;height:22px;border-radius:6px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px;font-weight:900}
.who-tag{font-size:12px;color:var(--muted)}
.hero{background:var(--navy);color:var(--card);border-radius:18px;padding:18px 18px 16px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.hero{background:var(--navy-soft);color:var(--ink)}}
.hero h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.5px}
.hero p{margin:3px 0 0;font-size:13px;opacity:.8}
.cycle{margin-top:14px}
.cycle-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.cycle-top b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.dots span{flex:1;min-width:10px;height:7px;border-radius:4px;background:rgba(255,255,255,.22)}
.dots span.on{background:#fff}
@media (prefers-color-scheme:dark){.dots span{background:var(--line)}.dots span.on{background:var(--brand)}}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--brand-soft);color:var(--bad)} .pill.navy{background:var(--navy-soft);color:var(--navy)}
.sec-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.2px;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stack{display:grid;gap:8px}
.ann{border-left:3px solid var(--line)}
.ann.unread{border-left-color:var(--brand)}
.ann-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;width:100%;background:none;border:0;padding:0;text-align:left}
.ann-title{font-weight:700;font-size:15px}
.ann-body{margin-top:8px;font-size:14px;white-space:pre-wrap;color:var(--ink)}
.ann-meta{font-size:12px;color:var(--muted);margin-top:2px}
.new{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none;margin-top:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:18px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:2}
.tab{border:0;border-radius:11px;padding:10px 0;background:var(--navy-soft);color:var(--muted);font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--navy);color:var(--card)}
@media (prefers-color-scheme:dark){.tab[aria-selected="true"]{background:var(--brand);color:#fff}}
.lesson-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.date{font-size:13px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.date small{font-weight:600;color:var(--muted);margin-left:4px}
.lesson-c{font-size:15px;font-weight:600;margin-top:6px}
.kv{display:grid;grid-template-columns:44px 1fr;gap:4px 8px;margin-top:8px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.bar{height:6px;background:var(--navy-soft);border-radius:4px;overflow:hidden;margin-top:3px;max-width:160px}
.bar i{display:block;height:100%;background:var(--ok)}
.hw-now{background:var(--brand-soft);border-color:transparent}
.hw-now .lbl{font-size:12px;font-weight:800;color:var(--bad)}
.hw-now .txt{font-size:16px;font-weight:700;margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:var(--brand);color:#fff;width:100%}
.btn.ghost{background:var(--navy-soft);color:var(--navy)}
.btn:disabled{opacity:.5}
.field{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 11px;font-size:15px;color:var(--ink);width:100%}
.field textarea{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--muted);font-size:13px}
.prog{height:8px;background:var(--navy-soft);border-radius:5px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.feedback{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--navy-soft);font-size:14px;white-space:pre-wrap}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
/* 원장 */
.admin-tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px}
.admin-tabs .tab{padding:9px 14px;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 8px}
.mini{border:0;background:var(--navy-soft);color:var(--navy);border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.mini.red{background:var(--brand-soft);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:90vw}
@media (prefers-color-scheme:dark){.toast{background:var(--ink);color:var(--bg)}}
video{width:100%;border-radius:10px;margin-top:8px;background:#000}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">불러오는 중…</div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = "https://hddsyoaymvpfcloqthyv.supabase.co";
const SB_KEY = "sb_publishable_cJHc-U-rvFrHVogusPcJ7A_x6uV1E4-";
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
const PHONE = "010-7419-3664";
const PART_BYTES = 45 * 1048576; // 저장소 파일당 50MB 제한 → 45MB 조각으로 나눠 올림
const MAX_TOTAL_MB = 1500;

const $app = document.getElementById("app");
const q = new URLSearchParams(location.search);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DOW = "일월화수목금토";
const md = d => { if (!d) return ""; const t = new Date(d + "T00:00:00+09:00"); return `${t.getMonth()+1}/${t.getDate()}<small>${DOW[t.getDay()]}</small>`; };
const ago = ts => { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; };
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
async function copy(text, label){
  try { await navigator.clipboard.writeText(text); toast(label || "복사했어요"); }
  catch { window.prompt("복사해서 쓰세요", text); }
}
const header = tag => `<div class="top"><div class="mark"><i>A</i>앤서수학</div><span class="who-tag">${esc(tag||"")}</span></div>`;
const foot = `<footer>앤서수학교습소 · 문의 ${PHONE}</footer>`;

/* ---------------- 학부모·학생 화면 ---------------- */
let FEED = null, TOKEN = null, TAB = "lessons";

async function loadPortal(){
  TOKEN = q.get("t");
  const { data, error } = await sb.rpc("portal_feed", { p_token: TOKEN });
  if (error || !data) {
    $app.innerHTML = header() + `<div class="center">링크가 만료됐거나 올바르지 않아요.<br>학원에 새 링크를 요청해 주세요.<br><br>${PHONE}</div>`;
    return;
  }
  FEED = data; renderPortal();
}

function cycleHtml(c, isParent){
  if (!c) return "";
  const total = Math.max(1, c.total|0), used = Math.min(total, c.used|0);
  let dots = ""; if (total <= 20) for (let i=0;i<total;i++) dots += `<span class="${i<used?"on":""}"></span>`;
  const pay = isParent && c.pay && c.pay !== "미표기" ? `<span class="pill ${c.pay==="결제 필요"?"bad":c.pay==="매월 정산"?"navy":"ok"}">${esc(c.pay)}</span>` : "";
  return `<div class="cycle"><div class="cycle-top"><span>이번 회차 <b>${used}</b> / ${total}회</span>${pay}</div>${dots?`<div class="dots">${dots}</div>`:""}</div>`;
}

function annHtml(list){
  if (!list.length) return "";
  return `<div class="sec-title">공지</div><div class="stack">` + list.map(a => `
    <div class="card ann ${a.read?"":"unread"}" data-ann="${a.id}">
      <button class="ann-head" aria-expanded="false">
        <div style="min-width:0"><div class="ann-title">${a.pinned?"📌 ":""}${esc(a.title)}</div>
        <div class="ann-meta">${ago(a.at)}${a.personal?" · 개별 안내":""}</div></div>
        ${a.read?"":`<span class="new" aria-label="안 읽음"></span>`}
      </button>
      <div class="ann-body" hidden>${esc(a.body)}</div>
    </div>`).join("") + `</div>`;
}

function lessonsHtml(list, isParent){
  if (!list.length) return `<div class="empty">아직 등록된 수업 기록이 없어요.</div>`;
  return `<div class="stack">` + list.map(l => {
    const absent = l.status === "결석";
    const badge = absent ? `<span class="pill ${l.deducted?"warn":"navy"}">결석${l.deducted?" · 차감":" · 차감 없음"}</span>`
                : (l.cycle_no ? `<span class="pill navy">${l.cycle_no}회차</span>` : "");
    const comp = l.hw_done ? (l.completion!=null ? `<dd>${l.completion}%<div class="bar"><i style="width:${Math.max(0,Math.min(100,l.completion))}%"></i></div></dd>` : `<dd>${esc(l.hw_done)}</dd>`) : "";
    const body = absent ? (isParent && l.reason ? `<div class="lesson-c">${esc(l.reason)}</div>` : `<div class="lesson-c">결석</div>`)
                : `<div class="lesson-c">${esc(l.content)}</div>`;
    return `<div class="card"><div class="lesson-row"><span class="date">${md(l.date)}</span>${badge}</div>${body}
      ${(!absent && (l.homework || comp)) ? `<dl class="kv">${l.homework?`<dt>숙제</dt><dd>${esc(l.homework)}</dd>`:""}${comp?`<dt>완성도</dt>${comp}`:""}</dl>`:""}</div>`;
  }).join("") + `</div>`;
}

function videosHtml(list, isStudent){
  const up = isStudent ? `
    <div class="card" style="margin-bottom:10px">
      <div style="font-weight:800;font-size:16px">복습영상 올리기</div>
      <div class="muted" style="margin-top:2px">문제 푸는 모습을 찍어서 올려줘. 3분 안쪽이면 좋아.</div>
      <div class="stack" style="margin-top:12px">
        <label class="field">어떤 문제? (예: 쎈 수열 212번)<input id="v-title" maxlength="80" placeholder="교재·단원·문제 번호"></label>
        <label class="field">선생님께 한마디 (선택)<input id="v-memo" maxlength="200" placeholder="막힌 부분이 있으면 적어줘"></label>
        <input type="file" id="v-file" accept="video/*" capture="environment" hidden>
        <button class="btn" id="v-pick">영상 고르기 / 촬영하기</button>
        <div id="v-status" class="muted" hidden></div>
        <div class="prog" id="v-prog" hidden><i></i></div>
      </div>
    </div>` : "";
  const items = list.length ? `<div class="stack">` + list.map(v => `
    <div class="card"><div class="lesson-row"><span class="date">${md(v.date)}</span>
      <span class="pill ${v.status==="확인 완료"?"ok":"navy"}">${esc(v.status||"제출됨")}</span></div>
      <div class="lesson-c">${esc(v.title||"복습영상")}</div>
      ${v.feedback?`<div class="feedback"><b>선생님 피드백</b><br>${esc(v.feedback)}</div>`:""}</div>`).join("") + `</div>`
    : `<div class="empty">${isStudent?"아직 올린 영상이 없어.":"아직 제출된 복습영상이 없어요."}</div>`;
  return up + items;
}

function analysesHtml(list){
  if (!list.length) return `<div class="empty">아직 올라온 시험 분석이 없어요.<br>시험이 끝나면 여기에 분석을 올려드려요.</div>`;
  return `<div class="stack">` + list.map(x => `
    <div class="card"><div class="lesson-row"><span class="date" style="font-size:15px">${esc(x.exam)}</span>${x.date?`<span class="muted">${ago(x.date)}</span>`:""}</div>
      ${x.summary?`<div class="lesson-c" style="font-weight:500">${esc(x.summary)}</div>`:""}
      <dl class="kv" style="grid-template-columns:62px 1fr">
        ${x.strengths?`<dt>잘한 점</dt><dd>${esc(x.strengths)}</dd>`:""}
        ${x.weaknesses?`<dt>보완할 점</dt><dd>${esc(x.weaknesses)}</dd>`:""}
        ${x.next?`<dt>다음 계획</dt><dd>${esc(x.next)}</dd>`:""}
      </dl></div>`).join("") + `</div>`;
}

function renderPortal(){
  const f = FEED, isParent = f.who === "parent", isStudent = !isParent;
  const st = f.student || {};
  const sub = [st.school, st.grade].filter(Boolean).join(" · ") || "앤서수학";
  const latestHw = (f.lessons || []).find(l => l.status !== "결석" && l.homework);
  const tabs = [["lessons","수업 일지"],["videos","복습영상"],["analyses","시험 분석"]];
  let body = "";
  if (TAB === "lessons") body = lessonsHtml(f.lessons||[], isParent);
  if (TAB === "videos") body = videosHtml(f.videos||[], isStudent);
  if (TAB === "analyses") body = analysesHtml(f.analyses||[]);
  $app.innerHTML = header(isParent ? `${st.name} 학부모님` : `${st.name}`) + `
    <div class="hero"><h1>${esc(st.name)}</h1><p>${esc(sub)}</p>${cycleHtml(f.cycle, isParent)}</div>
    ${latestHw ? `<div class="card hw-now"><div class="lbl">이번 숙제 · ${md(latestHw.date).replace(/<[^>]+>/g," ")} 수업</div><div class="txt">${esc(latestHw.homework)}</div></div>` : ""}
    ${annHtml(f.announcements||[])}
    <div class="tabs" role="tablist">${tabs.map(([k,v])=>`<button class="tab" role="tab" aria-selected="${TAB===k}" data-tab="${k}">${v}</button>`).join("")}</div>
    <div id="tabbody">${body}</div>${foot}`;
  bindPortal();
}

function bindPortal(){
  $app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { TAB = b.dataset.tab; renderPortal(); });
  $app.querySelectorAll("[data-ann]").forEach(card => {
    const head = card.querySelector(".ann-head"), body = card.querySelector(".ann-body");
    head.onclick = async () => {
      const open = body.hidden; body.hidden = !open; head.setAttribute("aria-expanded", String(open));
      if (open && card.classList.contains("unread")) {
        card.classList.remove("unread"); card.querySelector(".new")?.remove();
        const a = FEED.announcements.find(x => x.id === card.dataset.ann); if (a) a.read = true;
        try { await sb.rpc("portal_mark_read", { p_token: TOKEN, p_ann: card.dataset.ann }); } catch {}
      }
    };
  });
  const pick = document.getElementById("v-pick");
  if (pick) {
    const file = document.getElementById("v-file");
    pick.onclick = () => file.click();
    file.onchange = () => file.files[0] && uploadVideo(file.files[0]);
  }
}

async function uploadVideo(f){
  const status = document.getElementById("v-status"), prog = document.getElementById("v-prog"), pick = document.getElementById("v-pick");
  const mb = f.size / 1048576;
  status.hidden = false;
  if (mb > MAX_TOTAL_MB) { status.textContent = `영상이 ${mb.toFixed(0)}MB라서 너무 커. 반으로 나눠서 두 번 올려줘.`; return; }
  pick.disabled = true; prog.hidden = false;
  const n = Math.max(1, Math.ceil(f.size / PART_BYTES));
  status.textContent = `올리는 중… 화면을 닫지 마 (${mb.toFixed(0)}MB)`;
  try {
    const ext = (f.name.split(".").pop() || "mp4").toLowerCase();
    const r = await fetch(`${SB_URL}/functions/v1/portal-video`, { method:"POST", headers:{ "content-type":"application/json", apikey: SB_KEY },
      body: JSON.stringify({ action:"upload", token: TOKEN, ext, parts: n }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || "업로드 준비 실패");
    const urls = j.signedUrls || [j.signedUrl];
    let doneBytes = 0;
    for (let i = 0; i < n; i++) {
      const chunk = f.slice(i * PART_BYTES, Math.min(f.size, (i + 1) * PART_BYTES));
      for (let attempt = 1; ; attempt++) {
        try {
          await new Promise((res, rej) => {
            const x = new XMLHttpRequest();
            x.open("PUT", urls[i]);
            x.setRequestHeader("content-type", n > 1 ? "application/octet-stream" : (f.type || "video/mp4"));
            x.setRequestHeader("x-upsert", "true");
            x.upload.onprogress = e => { if (e.lengthComputable) prog.firstElementChild.style.width = ((doneBytes + e.loaded) / f.size * 100) + "%"; };
            x.onload = () => (x.status >= 200 && x.status < 300) ? res() : rej(new Error("업로드 실패 (" + x.status + ")"));
            x.onerror = () => rej(new Error("인터넷 연결을 확인해 줘"));
            x.send(chunk);
          });
          break;
        } catch (err) { if (attempt >= 3) throw err; status.textContent = `연결이 끊겨서 다시 시도하는 중… (${i + 1}/${n})`; await new Promise(r => setTimeout(r, 2000)); }
      }
      doneBytes += chunk.size;
    }
    const { error } = await sb.rpc("portal_register_video2", { p_token: TOKEN, p_path: j.path,
      p_title: document.getElementById("v-title").value.trim(), p_size: f.size, p_memo: document.getElementById("v-memo").value.trim(), p_parts: n });
    if (error) throw error;
    toast("영상 올렸어! 선생님이 확인할게");
    const { data } = await sb.rpc("portal_feed", { p_token: TOKEN }); if (data) { FEED = data; renderPortal(); }
  } catch (e) {
    status.textContent = "실패했어: " + (e.message || e) + ". 다시 해보고 안 되면 선생님께 말해줘.";
    pick.disabled = false;
  }
}

/* ---------------- 원장 화면 ---------------- */
let ADMIN = null, ADATA = null, ATAB = "ann";
const SITE = location.origin + location.pathname;

async function loadAdmin(){
  ADMIN = q.get("admin");
  const { data, error } = await sb.rpc("admin_overview", { p_admin: ADMIN });
  if (error || !data) { $app.innerHTML = header() + `<div class="center">원장 링크가 올바르지 않아요.</div>`; return; }
  ADATA = data; renderAdmin();
}

function renderAdmin(){
  const d = ADATA;
  const newVids = d.videos.filter(v => v.status === "제출됨").length;
  const tabs = [["ann","공지"],["links","학생 링크"],["videos",`영상${newVids?` (${newVids})`:""}`]];
  let body = "";
  if (ATAB === "ann") body = adminAnn(d);
  if (ATAB === "links") body = adminLinks(d);
  if (ATAB === "videos") body = adminVideos(d);
  $app.innerHTML = header("원장 화면") + `
    <div class="hero"><h1>원장 화면</h1><p>재원생 ${d.students.length}명 · 노션 동기화 ${d.last_sync ? ago(d.last_sync.at) : "기록 없음"}</p></div>
    <div class="admin-tabs" role="tablist">${tabs.map(([k,v])=>`<button class="tab" role="tab" aria-selected="${ATAB===k}" data-atab="${k}">${v}</button>`).join("")}</div>
    <div>${body}</div>`;
  bindAdmin();
}

function adminAnn(d){
  const opts = d.students.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  const grades = [...new Set(d.students.map(s => s.grade).filter(Boolean))].sort();
  const list = d.announcements.length ? d.announcements.map(a => `
    <div class="card"><div class="lesson-row"><div style="min-width:0"><div class="ann-title">${a.pinned?"📌 ":""}${esc(a.title)}</div>
      <div class="ann-meta">${ago(a.at)} · ${a.target?esc(a.target)+" 개별":a.grade?esc(a.grade):"전체"} · ${a.audience==="parents"?"학부모만":a.audience==="students"?"학생만":"학부모+학생"}</div></div>
      <button class="mini red" data-hide="${a.id}">내리기</button></div>
      <div class="ann-body">${esc(a.body)}</div>
      <div class="muted" style="margin-top:8px">읽음: 학부모 ${a.reads_parent} · 학생 ${a.reads_student}</div></div>`).join("")
    : `<div class="empty">아직 올린 공지가 없어요.</div>`;
  return `<div class="card"><div class="stack">
      <label class="field">제목<input id="a-title" maxlength="80" placeholder="예: 10/30(목) 보강 안내"></label>
      <label class="field">내용<textarea id="a-body" placeholder="학부모님·학생에게 보일 내용"></textarea></label>
      <div class="row2">
        <label class="field">누구에게<select id="a-aud"><option value="all">학부모+학생</option><option value="parents">학부모만</option><option value="students">학생만</option></select></label>
        <label class="field">범위<select id="a-scope"><option value="">전체 학생</option>${grades.map(g=>`<option value="g:${esc(g)}">${esc(g)}만</option>`).join("")}<optgroup label="한 명에게">${opts}</optgroup></select></label>
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="a-pin"> 맨 위에 고정</label>
      <button class="btn" id="a-send">공지 올리기</button>
    </div></div>
    <div class="sec-title">최근 60일 공지</div><div class="stack">${list}</div>`;
}

function kakaoText(s, kind){
  const url = `${SITE}?t=${kind==="parent"?s.parent_token:s.student_token}`;
  return kind === "parent"
    ? `[앤서수학] ${s.name} 학부모님, 수업 일지·회차·공지를 확인하실 수 있는 전용 링크입니다.\n${url}\n※ ${s.name} 전용 링크라 다른 분께는 공유하지 말아 주세요.`
    : `${s.name} 전용 링크야. 숙제 확인이랑 복습영상 올리는 거 여기서 하면 돼\n${url}`;
}

function adminLinks(d){
  return `<div class="muted" style="margin:0 2px 8px">링크를 누르면 카톡에 붙여넣을 문구까지 복사돼요. 링크가 새어나간 것 같으면 '새 링크'로 바꾸면 예전 링크는 바로 막혀요.</div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>학생</th><th>회차</th><th>학부모</th><th>학생</th></tr></thead><tbody>` +
  d.students.map(s => `<tr>
    <td><b>${esc(s.name)}</b><div class="muted">${esc([s.school,s.grade].filter(Boolean).join(" ")||"")}</div></td>
    <td style="white-space:nowrap">${s.cycle?`${s.cycle.used}/${s.cycle.total}`:"-"} ${s.cycle&&s.cycle.pay==="결제 필요"?`<span class="pill bad">결제</span>`:s.cycle&&s.cycle.pay==="미표기"?`<span class="pill warn">결제?</span>`:""}</td>
    <td><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="mini" data-copy="parent" data-id="${s.id}">복사</button><button class="mini" data-open="parent" data-id="${s.id}">보기</button><button class="mini red" data-rot="parent" data-id="${s.id}">새 링크</button></div></td>
    <td><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="mini" data-copy="student" data-id="${s.id}">복사</button><button class="mini" data-open="student" data-id="${s.id}">보기</button><button class="mini red" data-rot="student" data-id="${s.id}">새 링크</button></div></td>
  </tr>`).join("") + `</tbody></table></div>`;
}

function adminVideos(d){
  if (!d.videos.length) return `<div class="empty">아직 올라온 영상이 없어요.</div>`;
  return `<div class="stack">` + d.videos.map(v => `
    <div class="card" data-vid="${v.id}"><div class="lesson-row"><span class="date">${esc(v.student)} · ${md(v.date)}</span>
      <span class="pill ${v.status==="확인 완료"?"ok":"warn"}">${esc(v.status)}</span></div>
      <div class="lesson-c">${esc(v.title||"제목 없음")}</div>${v.memo?`<div class="muted">학생 메모: ${esc(v.memo)}</div>`:""}
      ${v.path?`<button class="mini" data-play="${esc(v.path)}" data-parts="${v.parts||1}" style="margin-top:8px">▶ 재생</button><div class="player"></div>`:`<div class="muted">예전 드라이브 영상</div>`}
      <label class="field" style="margin-top:10px">피드백 (학생·학부모에게 보여요)<textarea data-fb rows="3" style="min-height:70px">${esc(v.feedback||"")}</textarea></label>
      <button class="btn ghost" data-save style="margin-top:8px">피드백 저장 · 확인 완료</button>
      ${v.path?`<div style="display:flex;gap:6px;margin-top:8px"><button class="mini" data-ai-run="${v.id}">AI 분석 비교 돌리기</button><button class="mini" data-ai-show="${v.id}">결과 보기</button></div><div class="ai-box"></div>`:""}</div>`).join("") + `</div>`;
}

function bindAdmin(){
  $app.querySelectorAll("[data-atab]").forEach(b => b.onclick = () => { ATAB = b.dataset.atab; renderAdmin(); });
  const send = document.getElementById("a-send");
  if (send) send.onclick = async () => {
    const title = document.getElementById("a-title").value.trim(), body = document.getElementById("a-body").value.trim();
    if (!title) return toast("제목을 적어 주세요");
    const scope = document.getElementById("a-scope").value;
    send.disabled = true;
    const { error } = await sb.rpc("admin_post_announcement", { p_admin: ADMIN, p_title: title, p_body: body,
      p_audience: document.getElementById("a-aud").value,
      p_student: scope && !scope.startsWith("g:") ? scope : null,
      p_grade: scope.startsWith("g:") ? scope.slice(2) : null,
      p_pinned: document.getElementById("a-pin").checked });
    if (error) { toast("올리지 못했어요: " + error.message); send.disabled = false; return; }
    toast("공지를 올렸어요"); await loadAdmin();
  };
  $app.querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "정말 내릴까요?"; return; }
    await sb.rpc("admin_hide_announcement", { p_admin: ADMIN, p_id: b.dataset.hide }); toast("공지를 내렸어요"); await loadAdmin();
  });
  const byId = id => ADATA.students.find(s => s.id === id);
  $app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(kakaoText(byId(b.dataset.id), b.dataset.copy), "카톡 문구를 복사했어요"));
  $app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { const s = byId(b.dataset.id); window.open(`${SITE}?t=${b.dataset.open==="parent"?s.parent_token:s.student_token}`, "_blank"); });
  $app.querySelectorAll("[data-rot]").forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "예전 링크 막기?"; return; }
    const { error } = await sb.rpc("admin_rotate_link", { p_admin: ADMIN, p_student: b.dataset.id, p_kind: b.dataset.rot });
    toast(error ? "실패: " + error.message : "새 링크로 바꿨어요. 다시 보내 주세요"); await loadAdmin();
  });
  $app.querySelectorAll("[data-play]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    const parts = Number(b.dataset.parts) || 1;
    const r = await fetch(`${SB_URL}/functions/v1/portal-video`, { method:"POST", headers:{ "content-type":"application/json", apikey: SB_KEY },
      body: JSON.stringify({ action:"view", token: ADMIN, path: b.dataset.play, parts }) });
    const j = await r.json();
    if (!r.ok) { toast("재생 실패: " + (j.error||r.status)); b.disabled = false; return; }
    const box = b.nextElementSibling;
    if (parts <= 1) { box.innerHTML = `<video controls playsinline src="${esc(j.url)}"></video>`; return; }
    try {
      const blobs = [];
      for (let i = 0; i < j.urls.length; i++) {
        box.innerHTML = `<div class="muted" style="margin-top:8px">영상 불러오는 중… ${i + 1}/${j.urls.length}</div>`;
        const res = await fetch(j.urls[i]); if (!res.ok) throw new Error(res.status);
        blobs.push(await res.blob());
      }
      const url = URL.createObjectURL(new Blob(blobs, { type: "video/mp4" }));
      box.innerHTML = `<video controls playsinline src="${url}"></video>`;
    } catch (e) { toast("재생 실패: " + e.message); b.disabled = false; }
  });
  $app.querySelectorAll("[data-ai-run]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "돌리는 중… (1~3분)";
    const r = await fetch(`${SB_URL}/functions/v1/video-analyze`, { method:"POST", headers:{ "content-type":"application/json", apikey: SB_KEY },
      body: JSON.stringify({ action:"run", token: ADMIN, video_id: b.dataset.aiRun }) });
    if (!r.ok) { toast("시작 실패"); b.disabled = false; b.textContent = "AI 분석 비교 돌리기"; return; }
    const box = b.closest("[data-vid]").querySelector(".ai-box");
    const poll = async () => { const done = await showAi(b.dataset.aiRun, box); if (!done) setTimeout(poll, 5000); else { b.disabled = false; b.textContent = "다시 돌리기"; } };
    setTimeout(poll, 4000);
  });
  $app.querySelectorAll("[data-ai-show]").forEach(b => b.onclick = () => showAi(b.dataset.aiShow, b.closest("[data-vid]").querySelector(".ai-box")));
  $app.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
    const card = b.closest("[data-vid]");
    const { error } = await sb.rpc("admin_video_feedback", { p_admin: ADMIN, p_id: card.dataset.vid, p_feedback: card.querySelector("[data-fb]").value, p_status: "확인 완료" });
    toast(error ? "저장 실패: " + error.message : "저장했어요");
    if (!error) await loadAdmin();
  });
}

/* ---------------- 시작 ---------------- */
if (q.get("admin")) loadAdmin();
else if (q.get("t")) loadPortal();
else $app.innerHTML = header() + `<div class="center">학원에서 받은 개인 링크로 들어와 주세요.<br><br>문의 ${PHONE}</div>`;
</script>
</body>
</html>
