<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#B62A1D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>앤서수학 · 질문하기</title>
<style>
  :root { --red:#B62A1D; --navy:#1E2A44; --bg:#F6F7F9; --line:#E3E6EB; --muted:#6B7280; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--navy);
    font-family:-apple-system,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; }
  body { overscroll-behavior:none; user-select:none; }
  .screen { display:none; min-height:100%; flex-direction:column; }
  .screen.on { display:flex; }
  header { display:flex; align-items:center; gap:10px; padding:16px 18px 10px; }
  header .bar { width:5px; height:26px; background:var(--red); border-radius:2px; }
  header h1 { font-size:20px; margin:0; font-weight:800; letter-spacing:-.3px; }
  header .sub { margin-left:auto; color:var(--muted); font-size:13px; }
  .search { margin:4px 18px 10px; }
  .search input { width:100%; font-size:18px; padding:12px 14px; border:1.5px solid var(--line);
    border-radius:12px; background:#fff; outline:none; }
  .search input:focus { border-color:var(--navy); }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:0 18px 10px; }
  .chip { flex:none; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:#fff;
    font-size:14px; color:var(--muted); }
  .chip.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; padding:0 18px 24px; }
  .name { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:14px 6px; text-align:center; }
  .name:active { border-color:var(--red); background:#FFF5F4; }
  .name b { display:block; font-size:19px; }
  .name span { display:block; font-size:12px; color:var(--muted); margin-top:4px; }
  .center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; gap:14px; }
  .big { font-size:26px; font-weight:800; }
  .muted { color:var(--muted); font-size:15px; line-height:1.5; }
  .btn { border:0; border-radius:14px; font-size:19px; font-weight:700; padding:16px 22px; width:100%; max-width:420px; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.navy { background:var(--navy); color:#fff; }
  .btn.ghost { background:#fff; color:var(--navy); border:1.5px solid var(--line); }
  .btn:disabled { opacity:.5; }
  .row { display:flex; gap:10px; width:100%; max-width:420px; }
  .row .btn { flex:1; }
  #cropWrap { position:relative; flex:1; display:flex; align-items:center; justify-content:center; padding:8px; touch-action:none; overflow:hidden; background:#111; }
  #cropCanvas { max-width:100%; max-height:100%; touch-action:none; }
  .cropBar { padding:12px 18px 18px; background:#fff; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .cropBar .hint { font-size:14px; color:var(--muted); }
  .badge { display:inline-block; background:var(--red); color:#fff; border-radius:999px; padding:6px 16px; font-size:22px; font-weight:800; }
  .who { font-size:15px; color:var(--muted); }
  .who b { color:var(--navy); font-size:18px; }
  .spinner { width:42px; height:42px; border:4px solid var(--line); border-top-color:var(--red); border-radius:50%; animation:s 0.8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  .form { width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px; text-align:left; }
  .form input { width:100%; font-size:22px; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; background:#fff; outline:none; text-align:center; }
  .form input:focus { border-color:var(--navy); }
  .lb { font-size:14px; color:var(--muted); font-weight:700; margin-top:6px; }
  .grades { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .grades button { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:12px 0; font-size:17px; font-weight:700; color:var(--navy); }
  .grades button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .dots { display:flex; gap:14px; justify-content:center; margin:6px 0 4px; }
  .dot { width:18px; height:18px; border-radius:50%; border:2px solid var(--navy); }
  .dot.on { background:var(--navy); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:340px; }
  .key { border:0; background:#fff; border:1.5px solid var(--line); border-radius:14px; font-size:26px; font-weight:700; padding:16px 0; color:var(--navy); }
  .key:active { background:#EEF0F3; }
  .key.fn { font-size:16px; color:var(--muted); }
  .err { color:var(--red); font-size:15px; min-height:20px; font-weight:600; }
  .me { font-size:34px; font-weight:900; letter-spacing:-.5px; }
  .tag { display:inline-block; background:#EEF0F3; border-radius:999px; padding:4px 12px; font-size:13px; color:var(--muted); }
  .btn.huge { font-size:24px; padding:28px 22px; }
  .linkbtn { border:0; background:none; color:var(--muted); font-size:15px; text-decoration:underline; padding:10px; }
  .chk { font-size:14px; color:var(--muted); display:flex; align-items:center; gap:8px; min-height:22px; }
  .spinner.sm { width:16px; height:16px; border-width:3px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 18px; border-radius:12px; font-size:15px; display:none; max-width:90%; }
</style>
</head>
<body>

<!-- 1. 이름 입력 -->
<section class="screen on" id="sName">
  <header><div class="bar"></div><h1>로그인</h1><span class="sub" id="clock"></span></header>
  <div class="center" style="justify-content:flex-start;padding-top:40px">
    <div class="big">이름 입력</div>
    <div class="form">
      <input id="nameIn" placeholder="이름 (예: 김민준)" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="10" enterkeyhint="go">
      <div class="err" id="nameErr"></div>
      <button class="btn red" id="nameNext">다음</button>
    </div>
  </div>
</section>

<!-- 1-1. 처음 등록: 학교·학년 -->
<section class="screen" id="sReg">
  <header><div class="bar"></div><h1>처음 등록</h1></header>
  <div class="center" style="justify-content:flex-start;padding-top:30px">
    <div class="me" id="regName"></div>
    <div class="muted">처음이네! 학교랑 학년 알려줘.</div>
    <div class="form">
      <label class="lb">학교</label>
      <input id="schoolIn" placeholder="예: 대광고, 동대문중" autocomplete="off" spellcheck="false" maxlength="20" enterkeyhint="done">
      <label class="lb">학년</label>
      <div class="grades" id="grades"></div>
      <div class="err" id="regErr"></div>
      <button class="btn red" id="regNext">다음 · 비밀번호 만들기</button>
      <button class="linkbtn" id="regBack">처음으로</button>
    </div>
  </div>
</section>

<!-- 1-2. 비밀번호 -->
<section class="screen" id="sPin">
  <header><div class="bar"></div><h1 id="pinTitle">비밀번호</h1></header>
  <div class="center" style="gap:12px">
    <div class="me" id="pinName"></div>
    <div class="muted" id="pinMsg"></div>
    <div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="err" id="pinErr"></div>
    <div class="pad" id="pad"></div>
    <button class="linkbtn" id="pinBack">처음으로</button>
  </div>
</section>

<!-- 1-3. 로그인된 홈 -->
<section class="screen" id="sHome">
  <header><div class="bar"></div><h1>앤서수학 질문</h1><span class="sub" id="clock2"></span></header>
  <div class="center">
    <span class="tag">이 공기계는 지금</span>
    <div class="me" id="homeName"></div>
    <div class="muted" id="homeInfo">질문 있으면 아래 버튼 눌러.<br><b>문제 전체(번호·보기까지)가 다 나오게</b> 찍어줘.</div>
    <button class="btn red huge" id="askBtn">📷 질문하기</button>
    <div style="height:30px"></div>
    <button class="btn ghost" id="logoutBtn">공기계 반납 (로그아웃)</button>
    <div class="muted" style="font-size:13px">내 이름이 아니면 반납 누르고 다시 로그인해.</div>
  </div>
</section>

<!-- 2. 찍기 -->
<section class="screen" id="sShoot">
  <header><div class="bar"></div><h1>문제 찍기</h1></header>
  <div class="center">
    <div class="who"><b id="whoName"></b> 질문</div>
    <div class="big">질문할 문제를<br>찍어줘</div>
    <div class="muted">문제만 크게, 그림자 없이.<br>풀이 쓰기 전 문제 그대로 찍어.</div>
    <button class="btn red" id="shootBtn">📷 카메라 열기</button>
    <button class="btn ghost" id="cancelBtn">취소</button>
  </div>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>
</section>

<!-- 3. 자르기 -->
<section class="screen" id="sCrop">
  <div id="cropWrap"><canvas id="cropCanvas"></canvas></div>
  <div class="cropBar">
    <div class="hint">빨간 점·테두리를 끌어서 <b>문제 하나 전체</b>(번호·글·보기 다)에 맞춰줘 · 네모 안을 끌면 위치 이동</div>
    <div class="row">
      <button class="btn ghost" id="retakeBtn">다시 찍기</button>
      <button class="btn red" id="sendBtn">보내기</button>
    </div>
  </div>
</section>

<!-- 3-1. 보내기 전 확인 -->
<section class="screen" id="sConfirm">
  <header><div class="bar"></div><h1>이렇게 보낼게</h1></header>
  <div class="center" style="justify-content:flex-start;gap:12px">
    <div class="muted">문제 <b>번호·글·보기</b>가 다 보이는지 확인해줘.</div>
    <img id="confirmImg" style="max-width:100%;max-height:52vh;border:1px solid var(--line);border-radius:10px;background:#fff">
    <div class="row">
      <button class="btn ghost" id="reCropBtn">다시 자르기</button>
      <button class="btn red" id="confirmSendBtn">보내기</button>
    </div>
  </div>
</section>

<!-- 4. 보내는 중 / 완료 -->
<section class="screen" id="sDone">
  <div class="center" id="doneBox"></div>
</section>

<div id="toast"></div>

<script>
const FN = "https://hddsyoaymvpfcloqthyv.supabase.co/functions/v1/qna";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkZHN5b2F5bXZwZmNsb3F0aHl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODUwNzcsImV4cCI6MjA5Njc2MTA3N30._x8RtDqIACVr2AC7u5VXbntbmderTw4sV4t3zkp6dC0";

// 기기 토큰: 처음 한 번 ?k=… 로 열면 기기에 저장
const params = new URLSearchParams(location.search);
// 원장님 결정(11/16): 기기 등록 없이 어떤 폰이든 바로 열리게 — 공기계용 키를 내장. 학생은 이름+비밀번호로만 들어옴
const KIOSK_KEY = "89ad2154eb42658b74307011dc22c0b81b33945a4db024e8";
let TOKEN = params.get("k") || "";
try { if (TOKEN) localStorage.setItem("qk", TOKEN); else TOKEN = localStorage.getItem("qk") || ""; } catch (_) {}
if (!TOKEN) TOKEN = KIOSK_KEY;
// 주소에 k를 남겨둠 → 이 화면을 홈 화면에 추가해도 기기 등록이 같이 따라감

const $ = (id) => document.getElementById(id);
const show = (id) => { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); resetIdle(); };
const toast = (m) => { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 3500); };

// 응답이 안 오면 20초 뒤 포기 (화면 꺼졌다 켜졌을 때 버튼이 영영 안 눌리는 '먹통' 방지)
const fetchT = (url, opt, ms) => { const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
  return fetch(url, { ...opt, signal: ac.signal }).catch((e) => { throw new Error(e.name === "AbortError" ? "인터넷이 느려. 와이파이 확인하고 다시 해줘" : "인터넷 연결이 안 돼. 와이파이 확인해줘"); }).finally(() => clearTimeout(t)); };
async function call(action, body = {}) {
  const r = await fetchT(FN, { method: "POST", headers: { "content-type": "application/json", apikey: ANON, authorization: "Bearer " + ANON },
    body: JSON.stringify({ action, token: TOKEN, ...body }) }, 20000);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "오류 " + r.status);
  return j;
}

// 로그인 세션 (공기계에 저장, 4시간 뒤 만료)
let SESSION = "";
try { SESSION = localStorage.getItem("qsess") || ""; } catch (_) {}
const saveSession = (t) => { SESSION = t; try { t ? localStorage.setItem("qsess", t) : localStorage.removeItem("qsess"); } catch (_) {} };

// 시계
setInterval(() => { const d = new Date(); const t = d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }); $("clock").textContent = t; $("clock2").textContent = t; }, 1000);

// 가만히 두면 처음 화면으로 (90초)
let idleT;
// 가만히 두면: 로그인 전 화면(비밀번호 등)은 이름 화면으로, 로그인 후엔 홈으로
// 화면을 만지고 있으면 대기 시간 다시 셈 (자르는 중에 홈으로 튕기지 않게)
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, () => resetIdle(), { capture: true, passive: true }));
function resetIdle() { clearTimeout(idleT); idleT = setTimeout(() => {
  if (busy || $("sName").classList.contains("on") || $("sHome").classList.contains("on")) return;
  if (cur && SESSION) showHome(); else goNames();
}, 90000); }
["pointerdown", "keydown"].forEach(e => document.addEventListener(e, resetIdle));

// ───── 1. 이름 입력 ─────
let cur = null;
const GRADES = ["초6", "중1", "중2", "중3", "고1", "고2", "고3"];
let regGrade = "";
$("grades").innerHTML = GRADES.map(g => `<button data-g="${g}">${g}</button>`).join("");
$("grades").onclick = (e) => { const g = e.target.closest("button")?.dataset.g; if (!g) return; regGrade = g;
  [...$("grades").children].forEach(b => b.classList.toggle("on", b.dataset.g === g)); };
let nameBusy = false;
async function nameNext() {
  if (nameBusy) return;
  const n = $("nameIn").value.normalize("NFC").replace(/\s/g, "");
  if (n.length < 2) { $("nameErr").textContent = "이름을 끝까지 써줘"; return; }
  if (!TOKEN) { $("nameErr").textContent = "등록 안 된 기기야. 선생님한테 QR 다시 찍어달라고 해줘"; return; }
  nameBusy = true; $("nameNext").disabled = true; $("nameNext").textContent = "확인 중…"; $("nameErr").textContent = "";
  try {
    const r = await call("kiosk_check", { name: n });
    pinStudent = { name: r.name, has_pin: r.mode === "login", school: "", grade: "" };
    $("nameIn").blur();
    if (r.mode === "login") openPin();
    else { $("regName").textContent = r.name; $("schoolIn").value = ""; regGrade = ""; [...$("grades").children].forEach(b => b.classList.remove("on")); $("regErr").textContent = ""; show("sReg"); }
  } catch (e) { $("nameErr").textContent = e.message; }
  finally { nameBusy = false; $("nameNext").disabled = false; $("nameNext").textContent = "다음"; }
}
// 폰에서 한글 입력 중에 버튼을 누르면 키보드가 내려가면서 화면이 움직여 터치가 빗나가는 문제 방지:
// 손가락이 닿는 순간(pointerdown) 바로 처리하고, 키보드는 그대로 둠
function fastTap(el, fn) {
  let last = 0;
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); last = Date.now(); fn(); });
  el.addEventListener("click", () => { if (Date.now() - last > 800) fn(); });
}
fastTap($("nameNext"), nameNext);
$("nameIn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); nameNext(); } });
$("regBack").onclick = () => goNames();
function regNext() {
  const sc = $("schoolIn").value.trim();
  if (sc.length < 2) { $("regErr").textContent = "학교 이름 써줘"; return; }
  if (!regGrade) { $("regErr").textContent = "학년 골라줘"; return; }
  pinStudent.school = sc; pinStudent.grade = regGrade; $("schoolIn").blur(); openPin();
}
fastTap($("regNext"), regNext);
function goNames() { cur = null; pinStudent = null; $("nameIn").value = ""; $("nameErr").textContent = ""; show("sName"); window.scrollTo(0, 0); }
function showHome() { $("homeName").textContent = cur.name; $("whoName").textContent = cur.name; show("sHome"); }
$("cancelBtn").onclick = () => showHome();
$("askBtn").onclick = () => { openCamera(); };
$("logoutBtn").onclick = async () => {
  const s = SESSION; saveSession(""); goNames();
  if (s) call("kiosk_logout", { session: s }).catch(() => {});
};

// ───── 비밀번호 ─────
let pinStudent = null, pinBuf = "", pinFirst = "", pinMode = "login", pinBusy = false;
$("pad").innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join("")
  + '<button class="key fn" data-k="clr">지우기</button><button class="key" data-k="0">0</button><button class="key fn" data-k="del">←</button>';
function openPin() {
  pinBuf = ""; pinFirst = ""; pinMode = pinStudent.has_pin ? "login" : "new1";
  $("pinName").textContent = pinStudent.name; $("pinErr").textContent = "";
  pinLabels(); drawDots(); show("sPin");
}
function pinLabels() {
  $("pinTitle").textContent = pinMode === "login" ? "비밀번호 입력" : "비밀번호 만들기";
  $("pinMsg").innerHTML = pinMode === "login" ? "내 비밀번호 4자리"
    : pinMode === "new1" ? "처음이네! 앞으로 쓸 비밀번호 숫자 4자리 정해.<br>다른 애한테 보여주지 마."
    : "한 번 더 똑같이 눌러줘";
}
function drawDots() { [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i < pinBuf.length)); }
$("pinBack").onclick = goNames;
$("pad").onclick = async (e) => {
  const k = e.target.closest(".key")?.dataset.k; if (!k || pinBusy) return;
  if (k === "clr") pinBuf = ""; else if (k === "del") pinBuf = pinBuf.slice(0, -1);
  else if (pinBuf.length < 4) pinBuf += k;
  $("pinErr").textContent = ""; drawDots();
  if (pinBuf.length < 4) return;
  if (pinMode === "new1") { pinFirst = pinBuf; pinBuf = ""; pinMode = "new2"; pinLabels(); setTimeout(drawDots, 150); return; }
  if (pinMode === "new2" && pinBuf !== pinFirst) { pinBuf = ""; pinFirst = ""; pinMode = "new1"; pinLabels(); $("pinErr").textContent = "두 번이 달라. 처음부터 다시 정해줘"; setTimeout(drawDots, 150); return; }
  pinBusy = true;
  try {
    const r = await call("kiosk_login", { name: pinStudent.name, pin: pinBuf, school: pinStudent.school, grade: pinStudent.grade });
    saveSession(r.session);
    cur = { name: r.name };
    pinStudent.has_pin = true;
    showHome();
    if (r.created) toast("비밀번호 만들었어. 다음부터 이걸로 로그인해");
  } catch (err) {
    pinBuf = ""; drawDots(); $("pinErr").textContent = err.message;
    if (/이미 등록/.test(err.message)) { pinStudent.has_pin = true; pinMode = "login"; pinLabels(); }
  } finally { pinBusy = false; }
};

// ───── 2. 찍기 ─────
// 카메라 여는 동안 폰 메모리가 부족하면 이 페이지가 꺼졌다 다시 열림 → 표시해 두고 돌아왔을 때 안내
const openCamera = () => { try { sessionStorage.setItem("camOpen", String(Date.now())); } catch (_) {} $("file").value = ""; $("file").click(); };
$("shootBtn").onclick = openCamera;
$("retakeBtn").onclick = openCamera;
$("file").onchange = async () => {
  try { sessionStorage.removeItem("camOpen"); } catch (_) {}
  const f = $("file").files[0]; if (!f) return;
  try { await loadPhoto(f); show("sCrop"); } catch (e) { toast("사진을 못 읽었어. 다시 찍어줘."); }
};

// ───── 3. 자르기 ─────
let img = null, scale = 1, sel = null, DPR = 1;
const cv = $("cropCanvas"), cx = cv.getContext("2d");
const MAXPX = 2400;  // 폰 사진(1200만~5000만 화소)을 그대로 펼치면 메모리가 터져 화면이 하얗게 죽음 → 처음부터 줄여서 읽기
async function loadPhoto(file) {
  // 이전 사진 메모리 비우기
  if (img && img.width) { img.width = 0; img.height = 0; } img = null;
  let url = null;
  const src = await createImageBitmap(file, { imageOrientation: "from-image", resizeWidth: MAXPX, resizeQuality: "high" })
    .catch(() => createImageBitmap(file, { imageOrientation: "from-image" }))
    .catch(async () => { url = URL.createObjectURL(file); const im = new Image(); im.src = url; await im.decode(); return im; });
  // 사진을 먼저 평범한 캔버스 한 장으로 옮겨 둠 → 화면에 보이는 것과 잘라내는 것이 항상 같은 그림
  // (폰마다 사진 회전정보 처리 방식이 달라 '부분 자르기'만 엉뚱한 곳을 자르는 경우가 있음)
  const k = Math.min(1, MAXPX / Math.max(src.width, src.height));
  const base = document.createElement("canvas");
  base.width = Math.round(src.width * k); base.height = Math.round(src.height * k);
  const bg = base.getContext("2d"); bg.imageSmoothingQuality = "high"; bg.drawImage(src, 0, 0, base.width, base.height);
  try { src.close && src.close(); } catch (_) {}
  if (url) URL.revokeObjectURL(url);
  img = base;
  sel = null;
  requestAnimationFrame(layoutCrop);
}
// 화면 크기에 맞춰 자르기 화면 배치 (화면 회전·키보드 등으로 크기가 바뀌어도 선택 영역 유지)
function layoutCrop() {
  if (!img) return;
  const wrap = $("cropWrap");
  const W = wrap.clientWidth - 16, H = wrap.clientHeight - 16;
  if (W < 50 || H < 50) return;
  const r = sel && cv.width ? { x0: norm(sel).x / cv.width, y0: norm(sel).y / cv.height, x1: (norm(sel).x + norm(sel).w) / cv.width, y1: (norm(sel).y + norm(sel).h) / cv.height } : { x0: 0, y0: 0, x1: 1, y1: 1 };
  DPR = Math.min(3, window.devicePixelRatio || 1);
  const cssScale = Math.min(W / img.width, H / img.height, 1);
  scale = cssScale * DPR;
  cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
  cv.style.width = Math.round(img.width * cssScale) + "px"; cv.style.height = Math.round(img.height * cssScale) + "px";
  // 기본 선택: 사진 전체 (아무것도 안 건드리고 보내도 안 잘리게)
  sel = { x: r.x0 * cv.width, y: r.y0 * cv.height, w: (r.x1 - r.x0) * cv.width, h: (r.y1 - r.y0) * cv.height };
  draw();
}
window.addEventListener("resize", () => { if ($("sCrop").classList.contains("on")) requestAnimationFrame(layoutCrop); });
function draw() {
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.imageSmoothingQuality = "high"; cx.drawImage(img, 0, 0, cv.width, cv.height);
  if (!sel) return;
  const n = norm(sel);
  cx.fillStyle = "rgba(0,0,0,.55)";
  cx.beginPath(); cx.rect(0, 0, cv.width, cv.height); cx.rect(n.x, n.y, n.w, n.h); cx.fill("evenodd");
  cx.strokeStyle = "#fff"; cx.lineWidth = 3 * DPR; cx.strokeRect(n.x, n.y, n.w, n.h);
  cx.fillStyle = "#B62A1D";
  [[n.x, n.y], [n.x + n.w, n.y], [n.x, n.y + n.h], [n.x + n.w, n.y + n.h]].forEach(([a, b]) => { cx.beginPath(); cx.arc(a, b, 9 * DPR, 0, 7); cx.fill(); });
}
const norm = (r) => ({ x: Math.min(r.x, r.x + r.w), y: Math.min(r.y, r.y + r.h), w: Math.abs(r.w), h: Math.abs(r.h) });
// 손가락 위치 → 캔버스 좌표. 브라우저가 이 캔버스 기준으로 계산해 주는 offsetX 사용 (화면 확대돼 있어도 정확)
const pos = (e) => {
  const cw = cv.clientWidth || cv.getBoundingClientRect().width, ch = cv.clientHeight || cv.getBoundingClientRect().height;
  let x = e.offsetX, y = e.offsetY;
  if (typeof x !== "number" || e.target !== cv) { const b = cv.getBoundingClientRect(); x = e.clientX - b.left; y = e.clientY - b.top; }
  return { x: x * cv.width / cw, y: y * cv.height / ch };
};
// 자르기: 모서리·테두리를 끌면 크기 조절, 네모 안을 끌면 이동. (빈 곳을 눌러도 새 네모가 생기지 않음 → 실수로 잘리는 일 방지)
let drag = null;
cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId);
  const p = pos(e), n = norm(sel), R = 30 * cv.width / (cv.clientWidth || 1);
  const near = (a, b) => Math.abs(a - b) < R;
  const inX = p.x > n.x - R && p.x < n.x + n.w + R, inY = p.y > n.y - R && p.y < n.y + n.h + R;
  const L = near(p.x, n.x) && inY, Rt = near(p.x, n.x + n.w) && inY, T = near(p.y, n.y) && inX, B = near(p.y, n.y + n.h) && inX;
  if (L || Rt || T || B) drag = { mode: "resize", L, R: Rt, T, B, start: n };
  else if (p.x > n.x && p.x < n.x + n.w && p.y > n.y && p.y < n.y + n.h) drag = { mode: "move", px: p.x, py: p.y, start: n };
  else drag = null;
});
cv.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const p = pos(e), s0 = drag.start, MIN = 60 * DPR;
  p.x = Math.max(0, Math.min(cv.width, p.x)); p.y = Math.max(0, Math.min(cv.height, p.y));
  if (drag.mode === "move") {
    const nx = Math.max(0, Math.min(cv.width - s0.w, s0.x + p.x - drag.px)), ny = Math.max(0, Math.min(cv.height - s0.h, s0.y + p.y - drag.py));
    sel = { x: nx, y: ny, w: s0.w, h: s0.h };
  } else {
    let x0 = s0.x, y0 = s0.y, x1 = s0.x + s0.w, y1 = s0.y + s0.h;
    if (drag.L) x0 = Math.min(p.x, x1 - MIN); if (drag.R) x1 = Math.max(p.x, x0 + MIN);
    if (drag.T) y0 = Math.min(p.y, y1 - MIN); if (drag.B) y1 = Math.max(p.y, y0 + MIN);
    sel = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  draw();
});
cv.addEventListener("pointerup", () => { drag = null; });
cv.addEventListener("pointercancel", () => { drag = null; });

// 자르기 전 전체 사진 (AI가 잘린 부분을 전체에서 다시 읽을 수 있게)
function fullPhoto() {
  return new Promise(r => img.toBlob(r, "image/jpeg", 0.85));  // 이미 2400 이하로 줄여 둔 사진
}
const cropRatio = () => { const n = norm(sel); return [n.x / cv.width, n.y / cv.height, (n.x + n.w) / cv.width, (n.y + n.h) / cv.height]; };

// 원본(컬러) — 문제 복원·분석용으로 따로 보관
function cropOriginal() {
  const n = norm(sel);
  const sx = n.x / scale, sy = n.y / scale, sw = n.w / scale, sh = n.h / scale;
  const k = Math.min(1, 2400 / Math.max(sw, sh));
  const c = document.createElement("canvas"); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
}

// 잘라서 스캔한 것처럼 정리 (그림자 빼고 흰 바탕·진한 글씨)
function processCrop() {
  const n = norm(sel);
  const sx = n.x / scale, sy = n.y / scale, sw = n.w / scale, sh = n.h / scale;
  const MAX = 2400, k = Math.min(1, MAX / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  // 배경(조명) 추정: 크게 줄였다 늘린 흐린 이미지
  const sm = document.createElement("canvas"); sm.width = Math.max(4, Math.round(w / 28)); sm.height = Math.max(4, Math.round(h / 28));
  const sg = sm.getContext("2d"); sg.filter = "blur(1.5px)"; sg.drawImage(c, 0, 0, sm.width, sm.height);
  const bg = document.createElement("canvas"); bg.width = w; bg.height = h;
  const bgg = bg.getContext("2d"); bgg.imageSmoothingQuality = "high"; bgg.drawImage(sm, 0, 0, w, h);
  const D = g.getImageData(0, 0, w, h), B = bgg.getImageData(0, 0, w, h).data, d = D.data;
  for (let i = 0; i < d.length; i += 4) {
    const L = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const Lb = Math.max(40, 0.299 * B[i] + 0.587 * B[i + 1] + 0.114 * B[i + 2]);
    let v = Math.min(1, L / Lb);            // 0~1, 바탕≈1
    v = (v - 0.42) / 0.50;                   // 대비 올리기 (가는 획은 살림)
    v = v <= 0 ? 0 : v >= 1 ? 1 : Math.pow(v, 1.15);
    const o = Math.round(v * 255);
    d[i] = d[i + 1] = d[i + 2] = o;
  }
  g.putImageData(D, 0, 0);
  sm.width = sm.height = 0; bg.width = bg.height = 0;  // 임시 캔버스 메모리 바로 반납
  return new Promise(r => c.toBlob((b) => { c.width = c.height = 0; r(b); }, "image/jpeg", 0.92));
}

// AI가 방금 사진을 다 읽었는지 확인 → 잘렸으면 바로 다시 찍게
async function checkPhoto(qid) {
  const autoHome = () => { clearTimeout(window._auto); window._auto = setTimeout(() => { if ($("sDone").classList.contains("on")) showHome(); }, 12000); };
  if (!qid) { autoHome(); return; }
  for (let i = 0; i < 25; i++) {
    await new Promise(r => setTimeout(r, 2000));
    if (!$("chk")) return;
    let r; try { r = await call("kiosk_q_status", { session: SESSION, id: qid }); } catch (_) { continue; }
    if (r.ocr_status === "error") break;
    if (r.ocr_status !== "done") continue;
    if (!r.bad) { $("chk").innerHTML = "✅ 문제 잘 찍혔어"; autoHome(); return; }
    // 잘림 → 다시 찍기 안내
    $("doneBox").innerHTML = `
      <div class="big" style="color:var(--red)">문제가 잘렸어</div>
      <div class="muted">문제 글이나 보기가 사진 밖으로 잘려서 선생님이 출력을 못 해.<br><b>문제 전체가 화면에 다 들어오게</b> 조금 떨어져서 다시 찍어줘.</div>
      <button class="btn red" id="retakeNow">📷 다시 찍기</button>
      <button class="btn ghost" id="keepIt">그냥 둘래</button>`;
    $("retakeNow").onclick = async () => {
      try { await call("kiosk_retake", { session: SESSION, id: qid }); } catch (_) {}
      openCamera();
    };
    $("keepIt").onclick = showHome;
    return;
  }
  if ($("chk")) $("chk").textContent = "";
  autoHome();
}

let busy = false, pending = null;
// 보내기 → 잘린 모습을 한 번 보여주고 확인받기
$("sendBtn").onclick = async () => {
  if (busy || !cur) return;
  const [blob, oblob] = await Promise.all([processCrop(), cropOriginal()]);
  pending = { blob, oblob, crop: cropRatio() };
  try { URL.revokeObjectURL($("confirmImg").src); } catch (_) {}
  $("confirmImg").src = URL.createObjectURL(oblob);
  show("sConfirm");
};
$("reCropBtn").onclick = () => show("sCrop");
$("confirmSendBtn").onclick = async () => {
  if (busy || !cur || !pending) return; busy = true;
  $("doneBox").innerHTML = '<div class="spinner"></div><div class="muted">보내는 중…</div>';
  show("sDone");
  try {
    const { blob, oblob, crop } = pending;
    const fblob = await fullPhoto();
    const { path, signedUrl, origPath, origSignedUrl, fullPath, fullSignedUrl } = await call("kiosk_upload_url", { session: SESSION });
    const put = (u, b) => fetchT(u, { method: "PUT", headers: { "content-type": "image/jpeg", "x-upsert": "false" }, body: b }, 60000);
    const [up, oup, fup] = await Promise.all([put(signedUrl, blob),
      origSignedUrl ? put(origSignedUrl, oblob).catch(() => null) : Promise.resolve(null),
      fullSignedUrl ? put(fullSignedUrl, fblob).catch(() => null) : Promise.resolve(null)]);
    if (!up.ok) throw new Error("사진 업로드 실패 (" + up.status + ")");
    const { position, id: qid } = await call("kiosk_submit", { session: SESSION, path, orig_path: oup && oup.ok ? origPath : "",
      full_path: fup && fup.ok ? fullPath : "", crop });
    $("doneBox").innerHTML = `
      <div class="who"><b>${cur.name}</b> 질문 접수</div>
      <div class="badge">${position}번째</div>
      <div class="big">선생님이 순서대로 갈게</div>
      <div class="muted">기다리는 동안 다른 문제 풀고 있어.</div>
      <div class="chk" id="chk"><span class="spinner sm"></span> 문제가 잘 찍혔는지 확인하는 중…</div>
      <button class="btn navy" id="sameBtn">✂️ 같은 사진에서 다른 문제 자르기</button>
      <button class="btn ghost" id="moreBtn">📷 새로 찍기</button>
      <button class="btn ghost" id="endBtn">확인</button>`;
    $("sameBtn").onclick = () => { sel = { x: 0, y: 0, w: cv.width, h: cv.height }; draw(); show("sCrop"); toast("이번엔 다른 문제에 네모를 맞춰줘"); };
    $("moreBtn").onclick = () => { openCamera(); };
    $("endBtn").onclick = showHome;
    clearTimeout(window._auto);
    checkPhoto(qid);
  } catch (e) {
    $("doneBox").innerHTML = `<div class="big">못 보냈어</div><div class="muted">${e.message}<br>와이파이 확인하고 다시 해줘.</div>
      <button class="btn red" id="againBtn">다시 보내기</button><button class="btn ghost" id="endBtn">취소</button>`;
    $("againBtn").onclick = () => { show("sCrop"); };
    $("endBtn").onclick = showHome;
    if (/로그인/.test(e.message)) { saveSession(""); $("againBtn").style.display = "none"; $("endBtn").textContent = "다시 로그인"; $("endBtn").onclick = goNames; }
  } finally { busy = false; }
};

// 학생이 쓰는 동안은 화면이 안 꺼지게 (꺼지면 폰 잠금화면이 뜨거나 페이지가 멈춤)
let wake = null;
async function keepAwake() {
  try {
    const want = !!(cur && SESSION) && document.visibilityState === "visible";
    if (want && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); }
    if (!want && wake) { await wake.release(); wake = null; }
  } catch (_) { wake = null; }
}
setInterval(keepAwake, 5000);
// 화면 다시 켰을 때: 멈춘 화면 복구 + 로그인 상태 다시 확인
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible") return;
  keepAwake();
  if ($("sCrop").classList.contains("on")) requestAnimationFrame(layoutCrop);  // 지워진 사진 다시 그리기
  if (busy) return;
  if (SESSION) {
    try {
      const { student } = await call("kiosk_me", { session: SESSION });
      if (!student) { saveSession(""); goNames(); }
      else { cur = student; if (!document.querySelector(".screen.on") || $("sName").classList.contains("on")) showHome(); }
    } catch (_) {}
  }
});

(async () => {
  let camLost = false;
  try { const t = Number(sessionStorage.getItem("camOpen") || 0); camLost = t && Date.now() - t < 10 * 60e3; sessionStorage.removeItem("camOpen"); } catch (_) {}
  if (!SESSION || !TOKEN) return;
  try {
    const { student } = await call("kiosk_me", { session: SESSION });
    if (student) { cur = student; showHome(); if (camLost) toast("사진이 안 넘어왔어. 📷 질문하기 눌러서 다시 찍어줘"); } else saveSession("");
  } catch (_) {}
})();
// 페이지를 폰에 저장해 두기 → 다시 열릴 때 하얀 화면 없이 바로 뜸
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// 학생 명단 30분마다 새로고침
// 로그인 만료 확인 (10분마다) — 4시간 지나면 자동 로그아웃
setInterval(async () => {
  if (!SESSION || !$("sHome").classList.contains("on")) return;
  try { const { student } = await call("kiosk_me", { session: SESSION }); if (!student) { saveSession(""); goNames(); } } catch (_) {}
}, 600000);
</script>
