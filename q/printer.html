<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>앤서수학 프린트</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/auto-render.min.js"></script>
<script src="sheet.js"></script>
<style>
  @page { size: A4; margin: 10mm; }
  body { margin:0; font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; color:#1E2A44; background:#F6F7F9; }
  .panel { max-width:560px; margin:40px auto; background:#fff; border:1px solid #E3E6EB; border-radius:16px; padding:24px; }
  .panel h1 { margin:0 0 6px; font-size:20px; display:flex; align-items:center; gap:10px; }
  .panel h1 .bar { width:5px; height:22px; background:#B62A1D; border-radius:2px; }
  .st { font-size:15px; margin:14px 0; padding:12px 14px; border-radius:10px; background:#EEF7F1; color:#1F8A5B; font-weight:700; }
  .st.err { background:#FDEEEE; color:#B62A1D; }
  .muted { color:#6B7280; font-size:13px; line-height:1.6; }
  .log { font-size:13px; margin-top:12px; max-height:240px; overflow:auto; }
  .log div { padding:6px 0; border-bottom:1px solid #F0F1F3; }
  button { border:0; border-radius:10px; padding:10px 14px; font-size:14px; font-weight:700; background:#1E2A44; color:#fff; cursor:pointer; }
  #out { display:none; }
  @media print {
    body { background:#fff; }
    .panel { display:none !important; }
    #out { display:block; }
  }
</style>
</head>
<body>
<div class="panel">
  <h1><span class="bar"></span>앤서수학 프린트</h1>
  <div class="muted">이 창을 켜두면 폰이나 관리자 페이지에서 <b>출력</b>을 누를 때 여기로 와서 바로 인쇄돼요. 창을 닫지 말고 최소화만 해두세요.</div>
  <div class="st" id="st">연결 중…</div>
  <button id="testBtn">테스트 페이지 인쇄</button>
  <div class="log" id="log"></div>
</div>
<div id="out"></div>
<script>
const FN = "https://hddsyoaymvpfcloqthyv.supabase.co/functions/v1/qna";
const params = new URLSearchParams(location.search);
let TOKEN = params.get("t") || "";
try { if (TOKEN) localStorage.setItem("qa", TOKEN); else TOKEN = localStorage.getItem("qa") || ""; } catch (_) {}
const $ = (id) => document.getElementById(id);
const setSt = (m, err) => { $("st").textContent = m; $("st").className = "st" + (err ? " err" : ""); };
const log = (m) => { const d = document.createElement("div"); d.textContent = new Date().toLocaleTimeString("ko-KR") + "  " + m; $("log").prepend(d); };
async function call(action, body = {}) {
  const r = await fetch(FN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action, token: TOKEN, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "오류 " + r.status);
  return j;
}
let busy = false;
async function tick() {
  if (busy || !TOKEN) return;
  busy = true;
  try {
    const r = await call("printer_next");
    setSt("✅ 연결됨 · 출력 기다리는 중 (" + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) + ")");
    if (r.job) {
      const names = [...new Set(r.items.map(q => q.students?.name))].join(", ");
      setSt("🖨 인쇄 중… " + names);
      try {
        // 관리자 화면에서 '답지 같이'를 켜면 label 앞에 ANS| 가 붙어 옴
        const lb = r.job.label || "", ans = lb.startsWith("ANS|");
        const info = await AnswerSheet.build($("out"), r.items, { label: (ans ? lb.slice(4) : lb) || undefined, answers: ans });
        await new Promise(res => setTimeout(res, 300));
        window.print();          // --kiosk-printing 으로 켜면 창 없이 바로 기본 프린터로 나감
        await call("printer_done", { job_id: r.job.id, ok: true });
        log(`인쇄함 · ${names} · ${info.problems}문제`);
      } catch (e) {
        await call("printer_done", { job_id: r.job.id, ok: false, error: e.message }).catch(() => {});
        log("인쇄 실패 · " + e.message);
      }
      $("out").innerHTML = "";
    }
  } catch (e) { setSt("연결 안 됨: " + e.message + " (인터넷 확인)", true); }
  finally { busy = false; }
}
$("testBtn").onclick = async () => {
  await AnswerSheet.build($("out"), [{ id: "t", student_id: "t", students: { name: "테스트" }, ocr_status: "done",
    typed: { body: "함수 $f(x)=x^3-3x+a$의 극댓값이 $5$일 때, 상수 $a$의 값은?", choices: ["$1$", "$2$", "$3$", "$4$", "$5$"], number: "12", confidence: "high" } }]);
  window.print(); $("out").innerHTML = ""; log("테스트 페이지 인쇄");
};
if (!TOKEN) setSt("원장 링크로 열어주세요 (?t=…)", true);
else { tick(); setInterval(tick, 3000); }
</script>
</body>
</html>
